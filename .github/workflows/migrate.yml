name: Manual Database Migration

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Target Alembic revision to verify"
        required: true
        default: "002_schema_v2"

jobs:
  migrate:
    name: Run Alembic Database Migration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Alembic migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: run.py
          FLASK_ENV: production
        run: |
          echo "Starting database migration..."
          flask db upgrade
          echo "Migration completed successfully."

      - name: Verify Alembic revision
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: run.py
          FLASK_ENV: production
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          echo "Checking current database revision..."
          flask db current

          python - <<'PY'
          import os
          import sys

          from alembic.migration import MigrationContext
          from app import create_app
          from app.extensions import db

          target_revision = os.environ["TARGET_REVISION"]

          app = create_app("production")

          with app.app_context():
              with db.engine.connect() as conn:
                  context = MigrationContext.configure(conn)
                  current_revision = context.get_current_revision()

          print(f"Current database revision: {current_revision}")
          print(f"Expected database revision: {target_revision}")

          if current_revision != target_revision:
              print(
                  f"VERIFICATION FAILED: "
                  f"expected {target_revision}, got {current_revision}"
              )
              sys.exit(1)

          print(
              f"VERIFICATION SUCCESS: "
              f"database is at {target_revision}"
          )
          PY
